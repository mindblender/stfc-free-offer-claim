<meta charset="utf-8">
<title>STFC Claim Free Offers</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 240px;
    padding: 14px 16px;
    font-family: Arial, sans-serif;
    background: #1f2937;
    color: #f9fafb;
  }

  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 12px;
    margin-bottom: 14px;
    border-bottom: 1px solid #374151;
  }

  .header span {
    font-size: 13px;
    font-weight: bold;
    line-height: 1.3;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .status {
    font-size: 13px;
    font-weight: 600;
  }
  .status.on  { color: #4ade80; }
  .status.off { color: #f87171; }

  /* Toggle switch */
  .switch {
    position: relative;
    display: inline-block;
    width: 44px;
    height: 24px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: #ef4444;
    border-radius: 24px;
    transition: background .25s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 18px;
    height: 18px;
    left: 3px;
    bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: transform .25s;
  }
  input:checked + .slider              { background: #22c55e; }
  input:checked + .slider::before      { transform: translateX(20px); }
</style>

<div class="header">
  <img src="icons/icon48-green.png" width="28" height="28" alt="">
  <span>STFC Claim Free Offers</span>
</div>

<div class="row">
  <span id="status" class="status">Auto-claiming: ON</span>
  <label class="switch" title="Toggle auto-claiming">
    <input type="checkbox" id="toggle">
    <span class="slider"></span>
  </label>
</div>

<script src="popup.js"></script>
